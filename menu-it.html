<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menù Italiano | La Colombina</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:
      radial-gradient(circle at top, rgba(30,70,140,0.35), transparent 35%),
      linear-gradient(180deg, #001b4d 0%, #002766 100%);
      color:white;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at bottom left, rgba(255,255,255,0.05), transparent 30%),
      radial-gradient(circle at bottom right, rgba(255,255,255,0.04), transparent 28%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:
      100% 100%,
      100% 100%,
      100% 80px;
      pointer-events:none;
    }

    .container{
      width:100%;
      max-width:1100px;
      margin:auto;
      padding:50px 20px 40px;
      position:relative;
      z-index:2;
    }

    .top{
      text-align:center;
      margin-bottom:35px;
    }

    .logo{
      width:280px;
      max-width:85%;
      margin-bottom:20px;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.08));
    }

    .back{
      display:inline-flex;
      align-items:center;
      gap:10px;
      text-decoration:none;
      color:white;
      font-size:15px;
      opacity:0.8;
      transition:0.2s;
      margin-bottom:25px;
    }

    .back:hover{
      opacity:1;
    }

    .menu-frame{
      width:100%;
      height:85vh;
      border:none;
      border-radius:22px;
      overflow:hidden;
      background:white;
      box-shadow:0 20px 60px rgba(0,0,0,0.25);
    }

    iframe{
      width:100%;
      height:100%;
      border:none;
    }

    @media(max-width:768px){

      .container{
        padding:35px 14px 25px;
      }

      .logo{
        width:220px;
      }

      .menu-frame{
        height:78vh;
        border-radius:18px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="top">

      <a href="index.html" class="back">
        ← Torna alla Home
      </a>

      <br>

      <img src="logo-bianco.png" class="logo" alt="La Colombina">

    </div>

    <div class="menu-frame">

      <iframe src="menu-italiano.pdf"></iframe>

    </div>

  </div>

</body>
</html>
