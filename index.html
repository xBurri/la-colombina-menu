<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Colombina</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
background:#001b4d;
font-family:Arial,sans-serif;
overflow-x:hidden;
}

    .overlay{
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 40%);
      pointer-events:none;
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:720px;
      text-align:center;
    }

    .logo{
      width:800px;
      max-width:95%;
      margin-bottom:12px;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.08));
    }

    .button{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      background:white;
      color:#0d2f6b;
      padding:17px 22px;
      border-radius:20px;
      margin-bottom:16px;
      font-size:17px;
      font-weight:bold;
      transition:0.25s ease;
      box-shadow:0 10px 30px rgba(0,0,0,0.18);
    }

    .button:hover{
      transform:translateY(-3px) scale(1.01);
      box-shadow:0 18px 40px rgba(0,0,0,0.25);
    }

    .button-left{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang{
      font-size:15px;
      opacity:0.7;
      font-weight:bold;
      min-width:28px;
    }

    .arrow{
      font-size:28px;
      font-weight:300;
    }

    @media(max-width:600px){

      body{
        align-items:center;
      }

      .container{
        transform:translateY(-35px);
      }

      .logo{
        width:420px;
        max-width:95%;
        margin-bottom:10px;
      }

      .button{
        font-size:16px;
        padding:15px 20px;
        border-radius:18px;
        margin-bottom:14px;
      }

    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at bottom left, rgba(255,255,255,0.05), transparent 30%),
      radial-gradient(circle at bottom right, rgba(255,255,255,0.04), transparent 28%),
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size:
      100% 100%,
      100% 100%,
      100% 80px;
      opacity:1;
      pointer-events:none;
    }

    body::after{
      content:"";
      position:absolute;
      inset:0;
      background:
      linear-gradient(to right, rgba(255,255,255,0.03), transparent 20%, transparent 80%, rgba(255,255,255,0.03));
      pointer-events:none;
    }

  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="container">

    <img src="logo-bianco.png" class="logo" alt="La Colombina Logo">

    <a class="button" href="menu-it.html">
      <div class="button-left">
        <span class="lang">🇮🇹</span>
        <span>Menù Italiano</span>
      </div>

      <span class="arrow">›</span>

    </a>

    <a class="button" href="menu-en.html">

      <div class="button-left">
        <span class="lang">🇬🇧</span>
        <span>English Menu</span>
      </div>

      <span class="arrow">›</span>

    </a>

  </div>

</body>
</html>
