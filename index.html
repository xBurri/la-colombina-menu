<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Colombina</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Manrope',sans-serif;
    min-height:100vh;
    background:
    radial-gradient(circle at top, rgba(30,70,140,0.35), transparent 35%),
    linear-gradient(180deg,#001b4d 0%,#002766 100%);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-x:hidden;
    color:white;
    position:relative;
    padding:60px 20px;
}

.overlay{
    position:absolute;
    inset:0;
    background:
    radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 40%);
    pointer-events:none;
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:720px;
    text-align:center;
}

.logo{
    width:880px;
    max-width:98%;
    margin-bottom:12px;
    filter:drop-shadow(0 0 12px rgba(255,255,255,.08));
}

.button{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    background:rgba(255,255,255,.06);
    color:white;
    padding:18px 22px;
    border-radius:20px;
    margin-bottom:16px;
    font-size:17px;
    font-weight:500;
    text-transform:uppercase;
    letter-spacing:.2px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    backdrop-filter:blur(6px);
    transition:.2s ease;
}

.button:hover{
    transform:translateY(-3px) scale(1.01);
    box-shadow:0 18px 40px rgba(0,0,0,.25);
}

.button-left{
    display:flex;
    align-items:center;
    gap:14px;
}

.lang{
    font-size:15px;
    font-weight:bold;
    min-width:28px;
}

.arrow{
    font-size:24px;
    font-weight:300;
    opacity:.85;
}

/* ---------------------- */

.divider{
    display:flex;
    align-items:center;
    gap:18px;
    margin:45px 0 28px;
    opacity:.9;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:rgba(255,255,255,.18);
}

.divider span{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:3px;
    color:rgba(255,255,255,.85);
    font-weight:600;
}

.contact-card{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    backdrop-filter:blur(6px);
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    padding:28px;
    text-align:left;
}

.contact-item{
    margin-bottom:24px;
}

.contact-item:last-of-type{
    margin-bottom:0;
}

.label{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:2px;
    color:rgba(255,255,255,.70);
    margin-bottom:8px;
}

.value,
.value a{
    color:white;
    text-decoration:none;
    font-size:17px;
    line-height:1.7;
}

.value a:hover{
    text-decoration:underline;
}

.map-button{
    margin-top:30px;
    display:flex;
    justify-content:center;
}

.map-button a{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    padding:16px 24px;
    border-radius:18px;
    transition:.2s ease;
    font-weight:600;
    width:100%;
    text-align:center;
}

.map-button a:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.12);
}

@media(max-width:600px){

.logo{
    width:420px;
    max-width:100%;
}

.button{
    font-size:16px;
    padding:15px 20px;
}

body{
    padding:40px 18px;
}

.contact-card{
    padding:22px;
}

}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<img src="logo-bianco.png" class="logo" alt="La Colombina Logo">

<a class="button" href="menu-it.html">
<div class="button-left">
<span class="lang">🇮🇹</span>
<span>Menù Italiano</span>
</div>
<span class="arrow">›</span>
</a>

<a class="button" href="menu-en.html">
<div class="button-left">
<span class="lang">🇬🇧</span>
<span>English Menu</span>
</div>
<span class="arrow">›</span>
</a>

<div class="divider">
<span>Contatti</span>
</div>

<div class="contact-card">

<div class="contact-item">
<div class="label">📍 Indirizzo</div>
<div class="value">
Via Provinciale 13<br>
21030 Brissago Valtravaglia (VA)
</div>
</div>

<div class="contact-item">
<div class="label">📞 Telefono</div>
<div class="value">
<a href="tel:03321585619">0332 1585619</a><br>
<a href="tel:3927852733">392 785 2733</a>
</div>
</div>

<div class="contact-item">
<div class="label">🐟 Specialità</div>
<div class="value">
Pesce
</div>
</div>

<div class="map-button">
<a href="https://maps.app.goo.gl/mrDv9jLnT46h1Xoj8" target="_blank" rel="noopener noreferrer">
📍 Ottieni indicazioni
</a>
</div>

</div>

</div>

</body>
</html>
