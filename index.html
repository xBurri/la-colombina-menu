<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Colombina</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      min-height:100vh;
      background:
      radial-gradient(circle at top, rgba(30,70,140,0.35), transparent 35%),
      linear-gradient(180deg, #001b4d 0%, #002766 100%);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow-x:hidden;
      color:white;
      position:relative;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 40%);
      pointer-events:none;
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:720px;
      text-align:center;
    }

    .logo{
      width:880px;
      max-width:98%;
      margin-bottom:12px;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.08));
    }

    .button{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      background:white;
      color:#0d2f6b;
      padding:14px 18px;
      border-radius:16px;
      margin-bottom:12px;
      font-size:15px;
      font-weight:600;
      transition:0.2s ease;
      box-shadow:0 4px 14px rgba(0,0,0,0.10);
    }

    .button:hover{
      transform:translateY(-3px) scale(1.01);
      box-shadow:0 18px 40px rgba(0,0,0,0.25);
    }

    .button-left{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang{
      font-size:15px;
      opacity:1;
      font-weight:bold;
      min-width:28px;
    }

    .arrow{
      font-size:28px;
      font-weight:300;
    }

    @media(max-width:600px){

      body{
        align-items:center;
      }

      .container{
        transform:translateY(-35px);
      }

      .logo{
        width:420px;
        max-width:100%;
        margin-bottom:10px;
      }

      .button{
        font-size:16px;
        padding:15px 20px;
        border-radius:18px;
        margin-bottom:14px;
      }

    }

  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="container">

    <img src="logo-bianco.png" class="logo" alt="La Colombina Logo">

    <a class="button" href="menu-it.html">
      <div class="button-left">
        <span class="lang">🇮🇹</span>
        <span>Menù Italiano</span>
      </div>

      <span class="arrow">›</span>

    </a>

    <a class="button" href="menu-en.html">

      <div class="button-left">
        <span class="lang">🇬🇧</span>
        <span>English Menu</span>
      </div>

      <span class="arrow">›</span>

    </a>

  </div>

</body>
</html>
