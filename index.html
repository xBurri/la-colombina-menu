<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Colombina</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      min-height:100vh;
      background:
radial-gradient(circle at top, rgba(30,70,140,0.35), transparent 35%),
linear-gradient(180deg, #001b4d 0%, #002766 100%);
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      color:white;
      position:relative;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:
      radial-gradient(circle at top, rgba(255,255,255,0.05), transparent 40%);
      pointer-events:none;
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:520px;
      text-align:center;
      animation:fadeIn 1.2s ease;
    }

    .logo{
      width:340px;
      max-width:95%;
      margin-bottom:18px;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.08));
    }

    .subtitle{
      font-size:15px;
      letter-spacing:2px;
      color:rgba(255,255,255,0.82);
      margin-bottom:42px;
    }

    .divider{
      width:140px;
      height:1px;
      background:rgba(255,255,255,0.25);
      margin:0 auto 38px auto;
      position:relative;
    }

    .divider::after{
      content:"∞";
      position:absolute;
      top:-12px;
      left:50%;
      transform:translateX(-50%);
      font-size:20px;
      color:rgba(255,255,255,0.4);
      background:transparent;
      padding:0 12px;
    }

    .button{
      width:100%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      background:white;
      color:#0d2f6b;
      padding:24px 28px;
      border-radius:20px;
      margin-bottom:22px;
      font-size:20px;
      font-weight:bold;
      transition:0.25s ease;
      box-shadow:0 10px 30px rgba(0,0,0,0.18);
    }

    .button:hover{
      transform:translateY(-3px) scale(1.01);
      box-shadow:0 18px 40px rgba(0,0,0,0.25);
    }

    .button-left{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .lang{
      font-size:15px;
      opacity:0.7;
      font-weight:bold;
      min-width:28px;
    }

    .arrow{
      font-size:28px;
      font-weight:300;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(25px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media(max-width:600px){

      .logo{
        width:280px;
      }

      .button{
        font-size:18px;
        padding:22px;
      }

    }

    
body::before{
content:"";
position:absolute;
left:0;
bottom:0;
width:100%;
height:100%;
background:
url('https://www.transparenttextures.com/patterns/waves.png');
opacity:0.08;
pointer-events:none;
}

body::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to right, rgba(255,255,255,0.03), transparent 20%, transparent 80%, rgba(255,255,255,0.03));
pointer-events:none;
}
    
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="container">

    <img src="logo-bianco.png" class="logo" alt="La Colombina Logo">
    <div class="subtitle">
      RISTORANTE • PIZZERIA • SPECIALITÀ PESCE
    </div>

    <div class="divider"></div>

    <a class="button" href="menu-italiano.pdf" target="_blank">

      <div class="button-left">
        <span class="lang">IT</span>
        <span>Menù Italiano</span>
      </div>

      <span class="arrow">›</span>

    </a>

    <a class="button" href="#">

      <div class="button-left">
        <span class="lang">GB</span>
        <span>English Menu</span>
      </div>

      <span class="arrow">›</span>

    </a>

  </div>

</body>
</html>
