<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Colombina</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d2f6b;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 400px;
    }

    .logo {
  width: 320px;
  max-width: 90%;
  margin-bottom: 30px;
}

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      font-family: Georgia, serif;
    }

    p {
      margin-bottom: 40px;
      color: rgba(255,255,255,0.8);
      letter-spacing: 1px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 18px;
      margin-bottom: 20px;
      background: white;
      color: #0d2f6b;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s ease;
    }

    .button:hover {
      transform: scale(1.02);
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="logo.png" class="logo" alt="La Colombina Logo">

<p>
  Ristorante • Pizzeria • Specialità Pesce
</p>

    <a class="button" href="menu-italiano.pdf" target="_blank">
  🇮🇹 Menù Italiano
</a>

    <a class="button" href="#">
      🇬🇧 English Menu
    </a>

  </div>

</body>
</html>
